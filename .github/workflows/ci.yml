name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Node LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Install locked development dependencies
        run: make bootstrap
      - name: Check repository files, backend, and frontend
        run: make hooks-check
      - name: Run local project gates
        run: make check
      - name: Verify SQLite runtime and database settings
        run: make db
        env:
          DATABASE_URL: sqlite+pysqlite:///${{ runner.temp }}/math-tutor-ci/test.sqlite3
      - name: Run on-disk SQLite integration tests
        run: make test-integration
      - name: Install smoke-test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify built UI and API in a browser
        run: make smoke
      - name: Report synthetic browser failure context
        if: failure()
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          for path in Path("test-results").glob("*/error-context.md"):
              print(path)
              print(path.read_text()[:20000])
          PYTHON
      - name: Evaluate original synthetic fixtures
        run: make eval-mock
      - name: Audit locked dependencies
        run: make audit

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build the non-root release container
        run: docker build -f infra/docker/Dockerfile -t math-practice-tutor:ci .
      - name: Verify the packaged API, UI and worker
        run: sh scripts/container-smoke.sh math-practice-tutor:ci
      - name: Scan the release container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: math-practice-tutor:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - name: Generate the release software bill of materials
        run: trivy image --format cyclonedx --output /tmp/math-tutor-sbom.json math-practice-tutor:ci

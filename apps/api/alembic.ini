# Alembic configuration for the Shepherd Academy Universe SQLite database.
# The database URL always comes from the application settings module
# (DATABASE_URL), never from this file. Run via `make migrate` with
# application writes stopped.

[alembic]
script_location = %(here)s/migrations

[loggers]
keys = root

[handlers]
keys = console

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
